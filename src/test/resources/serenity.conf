webdriver{
    driver = chrome
    autodownload = true
}

pages {
    urlGrupoBancolombia = "https://www.banistmo.com/wps/portal/banistmo/personas/"
}

serenity {
    take.screenshots = FOR_FAILURES
    take.screenshots = AFTER_EACH_STEP
}

#false para levantar el navegador; true para ejecutar en segundo plano.
headless.mode = false

environments {
  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = ["--start-maximized", "--incognito"]
        }
      }
    }
  }
  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = ["start-maximized", "incognito"]
        }
      }
    }
  }
  firefox {
    webdriver {
      capabilities {
        browserName = "firefox"
        pageLoadStrategy = "normal"
        acceptInsecureCerts = true
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        "moz:firefoxOptions" {
          args = ["start-maximized", "incognito"],
          prefs {
            "javascript.options.showInConsole": false
          },
          log {"level": "info"},
        }
      }
    }
  }
}